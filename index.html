<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MD Elite Quiz | Play & Earn</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --primary: #bc13fe; 
            --secondary: #240046;
            --accent: #00f2ff;
            --text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Orbitron', 'Cairo', sans-serif; }
        
        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at 50% 50%, #1a0033 0%, #050505 100%);
            color: var(--text); 
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { width: 95%; max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }

        /* منطقة الإعلانات الموحدة */
        .ad-container {
            width: 100%; max-width: 320px; margin: 15px auto; 
            display: flex; flex-direction: column; gap: 10px; align-items: center;
        }
        .ad-box { width: 100%; border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #000; }

        h1 { font-size: 2.2rem; color: var(--primary); text-shadow: 0 0 15px var(--primary); margin-top: 10px; }

        .screen { display: none; animation: slideIn 0.4s ease-out; }
        .active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 15px 25px; border-radius: 50px;
            font-weight: 900; cursor: pointer; transition: 0.3s; margin: 8px;
            box-shadow: 0 5px 15px rgba(188, 19, 254, 0.4);
            width: 85%; max-width: 280px;
        }
        .btn:hover { transform: scale(1.03); box-shadow: 0 0 20px var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .q-btn {
            background: var(--card); border: 2px solid var(--primary); color: white;
            padding: 15px 5px; border-radius: 12px; font-size: 1rem; cursor: pointer; font-weight: bold;
        }
        .q-btn:disabled { opacity: 0.2; border-color: #333; }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 15px;
            background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; border: 1px solid var(--primary);
        }
        .points { font-size: 1.3rem; color: var(--accent); font-weight: 900; }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px;
        }
        .modal {
            background: var(--card); border: 2px solid var(--primary); padding: 25px;
            border-radius: 25px; width: 100%; max-width: 450px; text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="home" class="screen active">
        <h1>MD ELITE QUIZ</h1>
        
        <div class="ad-container">
            <div class="ad-box">
                <script async="async" data-cfasync="false" src="https://pl29046687.profitablecpmratenetwork.com/143e5f315ba47220c623bfc5f3519c94/invoke.js"></script>
                <div id="container-143e5f315ba47220c623bfc5f3519c94"></div>
            </div>
            <div class="ad-box" style="height: 50px; transform: scale(0.9);">
                <script type="text/javascript">
                    atOptions = { 'key' : '4e601873f75ac2119bb16627c48e6783', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
                </script>
                <script type="text/javascript" src="https://www.highperformanceformat.com/4e601873f75ac2119bb16627c48e6783/invoke.js"></script>
            </div>
        </div>
        <p style="opacity: 0.6; margin-bottom: 20px; font-size: 0.9rem;">The Ultimate Multi-Language Challenge</p>
        <button class="btn" onclick="startMode('en')">START GAME (ENG)</button>
        <button class="btn" style="background: #222;" onclick="startMode('ar')">ابدأ اللعبة (عربي)</button>
    </div>

    <div id="game" class="screen">
        <div class="score-box">
            <div>TEAM A: <span id="s1" class="points">0</span></div>
            <div>TEAM B: <span id="s2" class="points">0</span></div>
        </div>
        <div id="board" class="grid"></div>
        <button class="btn" style="background:#444; width:50%; margin-top:20px;" onclick="location.reload()">BACK</button>
    </div>

    <div id="win" class="screen">
        <h1 style="font-size: 4rem;">🏆</h1>
        <h2 id="winner-msg">VICTORY!</h2>
        <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<div id="q-overlay" class="overlay">
    <div class="modal">
        <h3 id="q-cat" style="color: var(--primary); margin-bottom: 10px;">QUIZ</h3>
        <h2 id="q-text">Loading Question...</h2>
        <div style="margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center;">
            <button class="btn" style="width:45%; font-size: 0.7rem;" onclick="addScore(1)">TEAM A WIN</button>
            <button class="btn" style="width:45%; font-size: 0.7rem;" onclick="addScore(2)">TEAM B WIN</button>
            <button class="btn" style="background: #333; width:90%;" onclick="closeQ()">CANCEL</button>
        </div>
    </div>
</div>

<script type='text/javascript' src='https://pl29046619.profitablecpmratenetwork.com/c7/eb/05/c7eb05600ce216eb92606000ba2c2953.js'></script>

<script>
    let currentScore1 = 0;
    let currentScore2 = 0;
    let currentVal = 0;

    const values = [100, 200, 300, 400, 500, 600, 700, 800, 900];
    const questions = {
        en: ["Capital of France?", "Fastest animal?", "Chemical symbol for Water?", "First man on Moon?", "Owner of Tesla/X?", "Language of Web Browsers?", "Deepest Ocean?", "The Red Planet?", "Creator of Roblox?"],
        ar: ["عاصمة فرنسا؟", "أسرع حيوان؟", "الرمز الكيميائي للماء؟", "أول رجل مشى على القمر؟", "مالك شركة تسلا ومنصة X؟", "لغة البرمجة الأساسية للمواقع؟", "أعمق محيط في العالم؟", "ما هو الكوكب الأحمر؟", "من هو مؤسس لعبة روبلوكس؟"]
    };
    let activeLang = 'en';

    function startMode(lang) {
        activeLang = lang;
        document.getElementById('home').classList.remove('active');
        document.getElementById('game').classList.add('active');
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        values.forEach((val, index) => {
            let b = document.createElement('button');
            b.className = 'q-btn';
            b.innerText = val;
            b.onclick = () => showQuestion(index, val, b);
            board.appendChild(b);
        });
    }

    function showQuestion(idx, val, btn) {
        currentVal = val;
        document.getElementById('q-text').innerText = questions[activeLang][idx];
        document.getElementById('q-overlay').style.display = 'flex';
        btn.disabled = true;
    }

    function addScore(team) {
        if(team === 1) currentScore1 += currentVal;
        else currentScore2 += currentVal;
        document.getElementById('s1').innerText = currentScore1;
        document.getElementById('s2').innerText = currentScore2;
        closeQ();
    }

    function closeQ() {
        document.getElementById('q-overlay').style.display = 'none';
    }
</script>

</body>
</html>
