<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MD Elite Quiz | Play & Win</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --primary: #bc13fe; /* Neon Purple */
            --secondary: #240046;
            --accent: #00f2ff;
            --text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Orbitron', 'Cairo', sans-serif; }
        
        body { 
            background: var(--bg); 
            background-image: radial-gradient(circle at 50% 50%, #1a0033 0%, #050505 100%);
            color: var(--text); 
            min-height: 100vh;
        }

        .container { width: 95%; max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }

        /* مكان الإعلان العلوي */
        .ad-top { 
            width: 100%; min-height: 50px; background: rgba(255,255,255,0.05); 
            margin-bottom: 20px; border: 1px dashed #444; display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #666;
        }

        h1 { font-size: 2.5rem; color: var(--primary); text-shadow: 0 0 15px var(--primary); margin-bottom: 10px; }

        .screen { display: none; animation: slideIn 0.4s ease-out; }
        .active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; border: none; padding: 15px 30px; border-radius: 50px;
            font-weight: 900; cursor: pointer; transition: 0.3s; margin: 10px;
            box-shadow: 0 5px 15px rgba(188, 19, 254, 0.4);
            width: 80%; max-width: 300px;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .q-btn {
            background: var(--card); border: 2px solid var(--primary); color: white;
            padding: 20px; border-radius: 15px; font-size: 1.2rem; cursor: pointer;
        }
        .q-btn:disabled { opacity: 0.2; }

        .score-box {
            display: flex; justify-content: space-around; margin-bottom: 20px;
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px;
        }
        .points { font-size: 1.5rem; color: var(--accent); }

        /* Overlay for Questions */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            background: var(--card); border: 3px solid var(--primary); padding: 30px;
            border-radius: 30px; width: 90%; max-width: 500px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="ad-top" id="ad-top-slot">AD SPACE - PLACE BANNER HERE</div>

    <div id="home" class="screen active">
        <h1>MD ELITE QUIZ</h1>
        <p style="opacity: 0.7; margin-bottom: 30px;">Challenge your mind, dominate the leaderboard.</p>
        <button class="btn" onclick="startMode('en')">START GAME (ENG)</button>
        <button class="btn" style="background: #333;" onclick="startMode('ar')">ابدأ اللعبة (عربي)</button>
    </div>

    <div id="game" class="screen">
        <div class="score-box">
            <div>TEAM A: <span id="s1" class="points">0</span></div>
            <div>TEAM B: <span id="s2" class="points">0</span></div>
        </div>
        <div id="board" class="grid"></div>
    </div>

    <div id="win" class="screen">
        <h2 id="winner-msg">VICTORY!</h2>
        <button class="btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<div id="q-overlay" class="overlay">
    <div class="modal">
        <h2 id="q-text">Question Loading...</h2>
        <div style="margin-top: 20px;">
            <button class="btn" style="width:45%; font-size: 0.8rem;" onclick="addScore(1)">TEAM A CORRECT</button>
            <button class="btn" style="width:45%; font-size: 0.8rem;" onclick="addScore(2)">TEAM B CORRECT</button>
            <button class="btn" style="background: #444; width:90%;" onclick="closeQ()">CLOSE</button>
        </div>
    </div>
</div>

<script>
    let currentScore1 = 0;
    let currentScore2 = 0;
    let currentVal = 0;

    const data = [100, 200, 300, 400, 500, 600, 700, 800, 900];
    const questions = {
        en: ["Capital of France?", "Fastest animal?", "H2O is...?", "First man on moon?", "Owner of X (Twitter)?", "Programming language for web?", "Largest Ocean?", "Red Planet?", "Creator of Roblox?"],
        ar: ["عاصمة فرنسا؟", "أسرع حيوان؟", "رمز الماء؟", "أول رجل على القمر؟", "مالك منصة إكس؟", "لغة برمجة المتصفح؟", "أكبر محيط؟", "الكوكب الأحمر؟", "مؤسس روبلوكس؟"]
    };
    let activeLang = 'en';

    function startMode(lang) {
        activeLang = lang;
        document.getElementById('home').classList.remove('active');
        document.getElementById('game').classList.add('active');
        renderBoard();
    }

    function renderBoard() {
        const board = document.getElementById('board');
        data.forEach((val, index) => {
            let b = document.createElement('button');
            b.className = 'q-btn';
            b.innerText = val;
            b.onclick = () => showQuestion(index, val, b);
            board.appendChild(b);
        });
    }

    function showQuestion(idx, val, btn) {
        currentVal = val;
        document.getElementById('q-text').innerText = questions[activeLang][idx];
        document.getElementById('q-overlay').style.display = 'flex';
        btn.disabled = true;
    }

    function addScore(team) {
        if(team === 1) currentScore1 += currentVal;
        else currentScore2 += currentVal;
        updateUI();
        closeQ();
    }

    function updateUI() {
        document.getElementById('s1').innerText = currentScore1;
        document.getElementById('s2').innerText = currentScore2;
    }

    function closeQ() {
        document.getElementById('q-overlay').style.display = 'none';
    }
